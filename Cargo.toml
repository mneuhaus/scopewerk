[workspace]
resolver = "2"
members = ["crates/scopewerk-core", "crates/scopewerk-cli", "crates/scopewerk-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mneuhaus/scopewerk"
homepage = "https://mneuhaus.github.io/scopewerk/"

[workspace.dependencies]
scopewerk-core = { path = "crates/scopewerk-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
