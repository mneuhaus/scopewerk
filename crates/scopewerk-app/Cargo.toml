[package]
name = "scopewerk-app"
description = "Scopewerk: the Hanmatek DOS1102 oscilloscope as a native GPUI app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scopewerk-app"
path = "src/main.rs"

[dependencies]
scopewerk-core.workspace = true
anyhow.workspace = true
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit = "0.7.3"
