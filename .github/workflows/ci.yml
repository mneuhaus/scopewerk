name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Metal toolchain (gpui compiles its shaders at build time)
        run: xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Latest stable Rust (the runner image lags behind)
        run: rustup update stable --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update; rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  linux:
    # The driver, decoders, CLI and MCP server; the GUI targets macOS and Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p scopewerk-core -p scopewerk-cli --all-targets -- -D warnings
      - run: cargo test -p scopewerk-core -p scopewerk-cli
